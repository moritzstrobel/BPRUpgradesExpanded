// -----------------------------------------------------------------------------
// BPRUE UI compatibility patch for reused BaseGame upgrade effects.
//
// Some vanilla weapon-upgrade effects are functional but do not provide a
// LocalizationSID. When reused by BPRUE modules the upgrade screen therefore
// renders the fallback key "sid_effects___name". Keep the original gameplay
// values untouched and only supply the missing UI metadata.
// -----------------------------------------------------------------------------

RecoilDown10Effect : struct.begin {bpatch}
   LocalizationSID = bprue_recoil
   ShowUpgradeEffectValue = true
   ShowUpgradeEffect = true
struct.end

RecoilDown15Effect : struct.begin {bpatch}
   LocalizationSID = bprue_recoil
   ShowUpgradeEffectValue = true
   ShowUpgradeEffect = true
struct.end

WeightDown15Effect : struct.begin {bpatch}
   LocalizationSID = bprue_weight
   ShowUpgradeEffectValue = true
   ShowUpgradeEffect = true
struct.end
