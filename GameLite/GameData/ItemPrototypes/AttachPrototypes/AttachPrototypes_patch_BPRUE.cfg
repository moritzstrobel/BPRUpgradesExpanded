// -----------------------------------------------------------------------------
// BPRUE attachment compatibility patches
// -----------------------------------------------------------------------------

// The pistol-slot Viper inherits the vanilla Viper weapon setup, but attachments
// that explicitly whitelist weapon prototype SIDs also need to accept the new SID.
EN_GoloScope_1 : struct.begin {bpatch}
   FittingWeaponsSIDs : struct.begin {bpatch}
      [*] = BPRUE_GunViper_Pistol_PP
   struct.end
struct.end

EN_Silen_2 : struct.begin {bpatch}
   FittingWeaponsSIDs : struct.begin {bpatch}
      [*] = BPRUE_GunViper_Pistol_PP
   struct.end
struct.end

GunViper_MagIncreased : struct.begin {bpatch}
   FittingWeaponsSIDs : struct.begin {bpatch}
      [*] = BPRUE_GunViper_Pistol_PP
   struct.end
struct.end
