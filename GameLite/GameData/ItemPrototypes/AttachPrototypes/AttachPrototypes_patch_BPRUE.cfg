// Pistol-slot variants inherit the vanilla weapon setup, but attachments that
// explicitly whitelist weapon prototype SIDs also need to accept the new SIDs.
EN_GoloScope_1 : struct.begin {bpatch}
   FittingWeaponsSIDs : struct.begin {bpatch}
      [*] = BPRUE_GunViper_Pistol_PP
      [*] = BPRUE_GunIntegral_Pistol_PP
   struct.end
struct.end

