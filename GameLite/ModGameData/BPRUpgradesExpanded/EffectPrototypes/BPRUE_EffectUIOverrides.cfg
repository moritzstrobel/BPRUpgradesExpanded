// -----------------------------------------------------------------------------
// BPRUE effect UI overrides.
//
// Technical effects perform upgrade mechanics but are not player-facing stat
// modifiers. Explicitly hide them so the UI never falls back to an empty
// LocalizationSID such as "sid_effects___name".
// -----------------------------------------------------------------------------

BPRUE_AddBurstFireModeEffect : struct.begin {bpatch}
   ShowUpgradeEffectValue = false
   ShowUpgradeEffect = false
struct.end

BPRUE_SemiAutoOnlyEffect : struct.begin {bpatch}
   ShowUpgradeEffectValue = false
   ShowUpgradeEffect = false
struct.end

BPRUE_ChangeCaliber762NATOEffect : struct.begin {bpatch}
   ShowUpgradeEffectValue = false
   ShowUpgradeEffect = false
struct.end
