// -----------------------------------------------------------------------------
// POC: test whether AdditionalRestoreSlots can allow two attachments that share
// EAttachSlot::Scope to remain installed at the same time.
//
// Test A restores Scope after installation. Test B is a normal Scope.
// Install A first, then B. If both remain installed, the enum slot can be
// reused as an occupancy bucket while SIDs/sockets provide logical part slots.
// -----------------------------------------------------------------------------

BPRUE_TestScope_Restore : struct.begin {refurl=@BaseGame/ItemPrototypes/AttachPrototypes.cfg;refkey=RU_ColimScope_1}
   SID = BPRUE_TestScope_Restore
   Cost = 1.0

   FittingWeaponsSIDs : struct.begin
      [0] = GunAKU_PP
   struct.end

   AdditionalRestoreSlots : struct.begin
      [*] = EAttachSlot::Scope
   struct.end
struct.end

